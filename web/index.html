<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; connect-src 'self' https://urcutleggwgtmsedevwb.supabase.co wss://urcutleggwgtmsedevwb.supabase.co; img-src 'self' data: blob:; font-src 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>OrçaFácil Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>OrçaFácil</h1>
      <p>Orçamentos rápidos pelo celular</p>
    </div>
    <div class="top-actions"><button id="loginBtnTop" class="secondary">Entrar</button><button id="empresaBtn" class="secondary">Empresa</button><button id="novoBtn" class="secondary">Novo</button></div>
  </header>

  <main class="container">
    <section id="formView" class="view">
      <div class="card">
        <div class="section-title">
          <div><span class="eyebrow">NOVO ORÇAMENTO</span><h2>Dados do cliente</h2></div>
          <span id="numeroPreview" class="badge">#1</span>
        </div>

        <label>Título do orçamento
          <input id="titulo" type="text" placeholder="Ex.: Manutenção do computador">
        </label>
        <label>Nome do cliente
          <input id="cliente" type="text" placeholder="Ex.: João da Silva" autocomplete="name">
        </label>
        <div class="grid-2">
          <label>Telefone
            <input id="telefone" type="tel" placeholder="(75) 99999-9999" autocomplete="tel">
          </label>
          <label>E-mail
            <input id="emailCliente" type="email" placeholder="cliente@email.com" autocomplete="email">
          </label>
        </div>
        <label>Endereço
          <input id="enderecoCliente" type="text" placeholder="Rua, número, bairro, cidade - UF" autocomplete="street-address">
        </label>
        <label>Validade
          <select id="validade">
            <option value="7">7 dias</option>
            <option value="10">10 dias</option>
            <option value="15">15 dias</option>
            <option value="30">30 dias</option>
          </select>
        </label>
      </div>

      <div class="card">
        <div class="section-title">
          <div><span class="eyebrow">ITENS</span><h2>O que será feito?</h2></div>
        </div>
        <div class="item-form">
          <label>Descrição
            <input id="descricao" type="text" placeholder="Ex.: Manutenção do computador">
          </label>
          <div class="grid-2">
            <label>Quantidade
              <input id="quantidade" type="text" inputmode="decimal" value="1">
            </label>
            <label>Valor unitário
              <input id="valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
            </label>
          </div>
          <button id="adicionarBtn" class="primary full">+ Adicionar item</button>
        </div>
        <div id="itensLista" class="items-list"><div class="empty">Nenhum item adicionado.</div></div>
        <div class="total-row"><span>Total</span><strong id="total">R$ 0,00</strong></div>
      </div>

      <div class="card">
        <label>Forma de pagamento
          <input id="pagamento" type="text" placeholder="Ex.: 50% na aprovação e 50% na entrega">
        </label>
        <label>Prazo de execução
          <input id="prazo" type="text" placeholder="Ex.: Até 5 dias úteis">
        </label>
        <label>Garantia
          <input id="garantia" type="text" placeholder="Ex.: 90 dias para mão de obra">
        </label>
        <label>Observações
          <textarea id="observacoes" rows="3" placeholder="Prazo, forma de pagamento, garantia..."></textarea>
        </label>
      </div>

      <button id="gerarBtn" class="primary full big">Gerar orçamento em PDF</button>
    </section>

    <section id="empresaView" class="view hidden">
      <div class="page-title">
        <div><span class="eyebrow">CONFIGURAÇÃO</span><h2>Dados da empresa</h2></div>
        <button id="fecharEmpresaBtn" class="secondary">Voltar</button>
      </div>
      <div class="card">
        <p class="form-help">Cadastre uma vez. Esses dados aparecem automaticamente nos próximos PDFs.</p>
        <label>Nome da empresa / profissional
          <input id="empresaNome" type="text" placeholder="Ex.: João Serviços">
        </label>
        <label>CPF ou CNPJ
          <input id="empresaDocumento" type="text" placeholder="Opcional">
        </label>
        <div class="grid-2">
          <label>Telefone / WhatsApp
            <input id="empresaTelefone" type="tel" placeholder="(75) 99999-9999">
          </label>
          <label>E-mail
            <input id="empresaEmail" type="email" placeholder="contato@empresa.com">
          </label>
        </div>
        <label>Endereço
          <input id="empresaEndereco" type="text" placeholder="Rua, número, bairro, cidade - UF">
        </label>
        <button id="salvarEmpresaBtn" class="primary full">Salvar dados da empresa</button>
      </div>
    </section>

    <section id="historicoView" class="view hidden">
      <div class="page-title">
        <div><span class="eyebrow">HISTÓRICO</span><h2>Meus orçamentos</h2></div>
        <button id="voltarBtn" class="secondary">Novo orçamento</button>
      </div>
      <div id="historicoLista"></div>
    </section>
  </main>

  <section id="printArea" aria-hidden="true"></section>

  <nav class="bottom-nav">
    <button id="navEmpresa">Empresa</button>
    <button id="navNovo" class="nav-active">Novo orçamento</button>
    <button id="navHistorico">Histórico</button>
  </nav>

  <script src="config.js?v=20261007-4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
  <script src="app.js?v=20261007-4"></script>
</body>
</html>
