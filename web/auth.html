<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://urcutleggwgtmsedevwb.supabase.co wss://urcutleggwgtmsedevwb.supabase.co; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>Entrar — OrçaFácil</title>
  <link rel="stylesheet" href="style.css?v=20261009-1">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card card">
      <div class="auth-brand">
        <span class="eyebrow">ORÇAFÁCIL</span>
        <h1>Seu negócio, seus orçamentos.</h1>
        <p>Entre para salvar seus dados na nuvem e acessar seus orçamentos em qualquer dispositivo.</p>
      </div>

      <div id="authStatus" class="form-help" role="status" aria-live="polite">Carregando autenticação...</div>

      <form id="authForm" novalidate>
        <label for="authEmail">E-mail
          <input id="authEmail" type="email" autocomplete="email" required maxlength="254" placeholder="voce@email.com">
        </label>
        <label for="authPassword">Senha
          <input id="authPassword" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="Mínimo de 8 caracteres">
        </label>
        <button id="loginBtn" class="primary full" type="submit">Entrar</button>
        <button id="signupBtn" class="secondary full" type="button">Criar conta</button>
      </form>

      <a class="auth-back" href="index.html">Continuar no modo local</a>
    </section>
  </main>

  <script src="config.js?v=20261007-4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
  <script src="auth.js?v=20261007-4"></script>
  <script src="auth-guard.js?v=20261007-1"></script>
</body>
</html>
